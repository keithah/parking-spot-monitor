services:
  parking-spot-monitor:
    build: .
    image: parking-spot-monitor:local
    command: ["python", "-m", "parking_spot_monitor", "--config", "/config/config.yaml", "--data-dir", "/data"]
    environment:
      - RTSP_URL
      - RTSP_URL_4K
      - RTSP_URL_360P
      - MATRIX_ACCESS_TOKEN
      - TZ=America/Los_Angeles
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
      - ${MODEL_DIR:-./models}:/models:ro
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 2m
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "parking_spot_monitor.healthcheck", "--health-file", "/data/health.json", "--max-age-seconds", "120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    # Hardware decode passthrough for Intel QSV/VAAPI.
    # Hosts without /dev/dri should remove or override this device mapping.
    devices:
      - /dev/dri:/dev/dri
